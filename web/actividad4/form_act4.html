<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Document</title>
	</head>
	<body>
		<h1>Controles de formulario</h1>
		<form method="post">
			<fieldset>
				<legend>Datos personales</legend><br>
				<label for="txtnombre">Nombre:</label>
				<input type="text" name="txtnombre"><br><br>
				<label for="txtcorreo">Correo electronico:</label>
				<input type="email" name="txtcorreo"><br><br>
				<label for="txturl">URL:</label>
				<input type="url" name="txturl" placeholder="Escribe la URL de tu página"><br><br>
				<label for="desciudad">Ciudad:</label>
					<select id="desciudad">
						<option value="Sevilla">Sevilla</option>
						<option value="Málaga">Málaga</option>
						<option value="Córdoba">Córdoba</option>
						<option value="Jaén">Jaén</option>
						<option value="Granada">Granada</option>
						<option value="Huelva">Huelva</option>
						<option value="Cádiz">Cádiz</option>
						<option value="Almería">Almería</option>
					</select>
			</fieldset>
			<fieldset>
				<legend>Otros datos</legend>
				<label for="fecha">Fecha:</label>
				<input type="date" name="fecha" id="fecha"><br><br>
				<label for="tiempo">Tiempo:</label>
				<input type="time" name="tiempo" id="tiempo"><br><br>
				<label for="fehora">Fecha y hora:</label>
				<input type="datetime-local" name="fehora" id="fehora"><br><br>
				<label for="mes">Mes:</label>
				<input type="month" name="mes" id="mes"><br><br>
				<label for="semana">Semana:</label>
				<input type="week" name="semana" id="semana"><br><br>
				<label for="numerominmax">Número (min -10, max 10):</label>
				<input type="number" name="numerominmax" id="numerominmax" min="0" max="10"><br><br>
				<label for="telefono">Teléfono:</label>
				<input type="tel" name="telefono" id="telefono"><br><br>
				<label for="terbusque">Término de búsqueda:</label>
				<input type="search" name="terbusque" id="terbusque"><br><br>
				<label for="colorf">Color favorito:</label>
				<input type="color" name="colorf" id="colorf"><br><br>
			</fieldset>
			<fieldset>
				<legend>Otros controles</legend>
				<label>Aficiones</label>
				<input type="checkbox" name="aficion1" id="aficion1" value="Cine">
				<label id="aficion1">Cine</label>
				<input type="checkbox" name="aficion2" id="aficion2" value="Deporte">
				<label id="aficion2">Deporte</label><br><br>
				<label>Forma de pago</label><br>
				<input type="radio" name="forpago" id="visa" value="VISA">
				<label for="visa">VISA</label>
				<input type="radio" name="forpago" id="aexpress" value="American express">
				<label for="visa">American express</label>
				<input type="radio" name="forpago" id="masterc" value="Mastercard">
				<label for="visa">Mastercard</label>
			</fieldset>
			<input type="submit" value="Enviar" id="btnenvio">
			<input type="reset" value="Borrar" id="btnborrar">
		</form>
	</body>
</html>
